<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TheVeera Embroidery Studio</title>
  <meta name="description" content="Embroidered clothing and keepsakes, stitched by hand.">
  <meta name="theme-color" content="#1f2d5c">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preload" href="assets/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Remember the first error in config.js so the page can say which line to fix.
    window.addEventListener('error', function (e) {
      if (!window.__configError && e.filename && /config\.js/.test(e.filename)) {
        window.__configError = { line: e.lineno, message: e.message };
      }
    });
  </script>
  <script src="config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="announcement" data-text="announcement"></div>

  <header class="site-header">
    <div class="container nav-bar">
      <button class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="menu-dialog" data-open="menu-dialog">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>

      <nav class="nav-links nav-primary" aria-label="Main">
        <ul data-list="menu"></ul>
      </nav>

      <a class="logo" href="#top">
        <img data-src="business.logo" data-alt="business.name" width="72" height="72" alt="">
      </a>

      <div class="nav-links nav-secondary">
        <a class="nav-whatsapp" data-whatsapp href="#">WhatsApp</a>
        <button class="bag-btn" type="button" aria-haspopup="dialog" aria-controls="bag-dialog" data-open="bag-dialog">
          <span class="bag-label">Bag (<span data-bag-count>0</span>)</span>
          <svg class="bag-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8Zm4 0V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span class="bag-badge" data-bag-count aria-hidden="true">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Hero -->
    <section id="top" class="container hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow" data-text="hero.eyebrow"></p>
        <h1 id="hero-title" class="display">
          <span data-text="hero.headline"></span>
          <em data-text="hero.headlineItalic"></em>
        </h1>
        <p class="lede" data-text="hero.text"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#shop" data-text="hero.primaryButton"></a>
          <a class="btn btn-outline" data-whatsapp="custom.whatsappMessage" href="#" data-text="hero.secondaryButton"></a>
        </div>
      </div>
      <ul class="hero-products" data-list="heroProducts"></ul>
    </section>

    <!-- Shop -->
    <section id="shop" class="shop" aria-labelledby="shop-title">
      <div class="container shop-by">
        <span class="eyebrow shop-by-label" id="shop-by-label" data-text="shop.shopByLabel"></span>
        <div class="chips" role="group" aria-labelledby="shop-by-label" data-list="categories"></div>
      </div>

      <div class="container shop-head">
        <h2 id="shop-title" class="section-title" data-text="shop.title"></h2>
        <button class="text-link view-all" type="button" hidden data-text="shop.viewAllLabel"></button>
      </div>

      <div class="container">
        <ul class="product-grid" data-list="products"></ul>
        <p class="empty-state" hidden>
          <span data-text="shop.emptyText"></span>
          <a class="text-link" data-whatsapp="custom.whatsappMessage" href="#" data-text="custom.secondaryButton"></a>
        </p>
      </div>
    </section>

    <!-- Custom order -->
    <section id="custom" class="custom" aria-labelledby="custom-title">
      <div class="custom-media" data-media="custom"></div>
      <div class="custom-body">
        <p class="eyebrow eyebrow-on-dark" data-text="custom.eyebrow"></p>
        <h2 id="custom-title" class="section-title" data-text="custom.title"></h2>
        <ol class="steps" data-list="steps"></ol>
        <div class="cta-row">
          <a class="btn btn-light" data-whatsapp="custom.whatsappMessage" href="#" data-text="custom.primaryButton"></a>
          <a class="btn btn-outline-light" data-whatsapp href="#" data-text="custom.secondaryButton"></a>
        </div>
      </div>
    </section>

    <!-- Testimonial -->
    <section class="container testimonial" aria-label="Customer review" data-show="testimonial">
      <figure>
        <div class="stars" role="img"></div>
        <blockquote><p class="quote"></p></blockquote>
        <figcaption class="eyebrow" data-text="testimonial.author"></figcaption>
      </figure>
    </section>

    <!-- About -->
    <section id="about" class="container about" aria-labelledby="about-title" data-show="about">
      <div class="about-media" data-media="about"></div>
      <div class="about-body">
        <p class="eyebrow" data-text="about.eyebrow"></p>
        <h2 id="about-title" class="section-title" data-text="about.title"></h2>
        <p class="lede" data-text="about.text"></p>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq" class="container faq" aria-labelledby="faq-title">
      <h2 id="faq-title" class="section-title" data-text="faq.title"></h2>
      <div class="faq-list" data-list="faq"></div>
    </section>
  </main>

  <footer id="contact" class="site-footer">
    <div class="container footer-grid">
      <a class="logo logo-lg" href="#top">
        <img data-src="business.logo" data-alt="business.name" width="96" height="96" alt="" loading="lazy">
      </a>
      <nav class="footer-col" aria-labelledby="footer-shop">
        <h2 class="footer-title" id="footer-shop" data-text="footer.shopTitle"></h2>
        <ul data-list="footerLinks"></ul>
      </nav>
      <div class="footer-col">
        <h2 class="footer-title" data-text="footer.contactTitle"></h2>
        <ul>
          <li><a data-email href="#"></a></li>
          <li><a data-phone href="#" translate="no"></a></li>
        </ul>
        <ul class="social" data-list="social"></ul>
      </div>
      <form class="newsletter" method="post" data-show="newsletter.formAction" target="_blank">
        <label class="newsletter-title" for="newsletter-email" data-text="newsletter.title"></label>
        <div class="newsletter-row">
          <input id="newsletter-email" type="email" name="email" autocomplete="email" spellcheck="false" required>
          <button type="submit" data-text="newsletter.button"></button>
        </div>
      </form>
    </div>
    <div class="container footer-base">
      <p>© <span data-year></span> <span data-text="business.name" translate="no"></span></p>
    </div>
  </footer>

  <!-- Mobile menu -->
  <dialog id="menu-dialog" class="sheet sheet-left" aria-labelledby="menu-title">
    <div class="sheet-head">
      <h2 id="menu-title" class="sheet-title">Menu</h2>
      <button class="icon-btn" type="button" aria-label="Close menu" data-close>
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav aria-label="Menu">
      <ul class="sheet-links" data-list="menuSheet"></ul>
    </nav>
    <div class="sheet-foot">
      <a class="btn btn-primary btn-block" data-whatsapp href="#">WhatsApp us</a>
      <a class="text-link" data-email href="#"></a>
    </div>
  </dialog>

  <!-- Bag -->
  <dialog id="bag-dialog" class="sheet sheet-right" aria-labelledby="bag-title">
    <div class="sheet-head">
      <h2 id="bag-title" class="sheet-title" data-text="bag.title"></h2>
      <button class="icon-btn" type="button" aria-label="Close bag" data-close>
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ul class="bag-items" data-list="bag"></ul>
    <div class="bag-empty" hidden>
      <p data-text="bag.emptyText"></p>
      <a class="btn btn-primary btn-block" href="#shop" data-close data-text="hero.primaryButton"></a>
    </div>
    <div class="bag-foot" hidden>
      <div class="bag-total"><span>Estimated total</span><span class="bag-total-value"></span></div>
      <a class="btn btn-primary btn-block bag-checkout" href="#" target="_blank" rel="noopener" data-text="bag.checkoutButton"></a>
      <p class="bag-note" data-text="bag.checkoutNote"></p>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="notice">Turn on JavaScript to see the full website.</p></noscript>

  <!-- Templates used by js/app.js -->
  <template id="tpl-hero-product">
    <li class="hero-product">
      <a class="hero-product-link">
        <div class="media"></div>
        <div class="hero-product-meta"><span class="name"></span><span class="price"></span></div>
      </a>
    </li>
  </template>

  <template id="tpl-product">
    <li class="product-card">
      <div class="media">
        <button class="add-btn" type="button"></button>
      </div>
      <h3 class="product-name"></h3>
      <p class="product-meta"></p>
    </li>
  </template>

  <template id="tpl-faq">
    <details class="faq-item">
      <summary><span class="faq-q"></span><span class="faq-icon" aria-hidden="true"></span></summary>
      <p class="faq-a"></p>
    </details>
  </template>

  <template id="tpl-bag-item">
    <li class="bag-item">
      <div class="media"></div>
      <div class="bag-item-body">
        <p class="bag-item-name"></p>
        <p class="bag-item-price"></p>
        <div class="stepper">
          <button class="step-btn step-minus" type="button"></button>
          <span class="step-qty"></span>
          <button class="step-btn step-plus" type="button">+</button>
        </div>
      </div>
    </li>
  </template>
</body>
</html>
